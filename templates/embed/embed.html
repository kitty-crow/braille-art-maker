<div
  data-unicode-art
  data-theme="{{THEME}}"
  data-surface="{{SURFACE}}"
  style="{{STYLE}}"
  role="img"
  aria-label="{{LABEL}}"
>
  <template data-unicode-art-template>
    <link rel="stylesheet" href="{{CSS_SRC}}">
    <div class="frame">
      <div class="grid" data-unicode-art-root></div>
    </div>
  </template>
  <script type="application/octet-stream" data-unicode-art-data data-codec="u1">{{DATA}}</script>
  <script src="{{LOAD_SRC}}" data-api="{{API_SRC}}"></script>
</div>
